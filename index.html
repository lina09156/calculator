<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>

<body>
  <div class="container mt-4">
    <div class="row">
      <div class="col-md-6">
        <form id="calc_form">
          <div class="mb-3">
            <label for="num1" class="form-label">Первое число</label>
            <input type="number" step="any" class="form-control" id="num1" required>
          </div>

          <div class="mb-3">
            <label for="operation" class="form-label">Операция</label>
            <select class="form-select" id="operation">
              <option value="+">Сложение (+)</option>
              <option value="-">Вычитание (-)</option>
              <option value="*">Умножение (*)</option>
              <option value="/">Деление (/)</option>
              <option value="^">Возведение в степень (^)</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="num2" class="form-label">Второе число</label>
            <input type="number" step="any" class="form-control" id="num2" required>
          </div>

          <button type="submit" class="btn btn-primary">Посчитать</button>
        </form>
      </div>
    </div>

    <div class="row">
      <div class="mt-3" id="output"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('calc_form');

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const a = Number(document.getElementById('num1').value);
      const b = Number(document.getElementById('num2').value);
      const operation = document.getElementById('operation').value;

      let result;

      if (operation === '+') {
        result = a + b;
      } else if (operation === '-') {
        result = a - b;
      } else if (operation === '*') {
        result = a * b;
      } else if (operation === '/') {
        if (b === 0) {
          result = 'На ноль делить нельзя!';
        } else {
          result = a / b;
        }
      } else if (operation === '^') {
        result = Math.pow(a, b);
      }

      const output = document.getElementById('output');
      output.innerHTML = `<p><b>Результат:</b> ${result}</p>`;
    });
  </script>
</body>
</html>
